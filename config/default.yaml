filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nx: 32
  Lx: 6.283185307179586  # 2π
  beta: 10
  kmin: 4.0 
  kmax: 10.0
  nz: 1
  # multi-layer model parameters (only used if nz>1)
  Lz: 50
  rek: 5.787e-7 # this might balls up with the number stuff - check if i should remove config file and just yaml it 
  rd: 15.0
  delta: 0.25
  U1: 0.0
  U2: 0.0
  hr_nx: 128

plotting:
  nsteps: 1000
  dt: 0.01
  plotting_window: 0
  cadence: 10
  plot: ['loss', 'mse', 'quad', 'cfl']
  group_animated: true
  auto_dt: true
  njets: 6
  spinup: 100000
  cfl: 0.5


forcing:
  k_f: 8.0           # central forcing wavenumber
  k_width: 2.0       # width of the ring
  epsilon: 0.001     # energy injection rate

ml:
  enabled: true
  model_type: mlp
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 7
  n_test: 2
  steps_per_day: 48    # number of model timesteps that correspond to 1 "day"
  start_days: 2        # initial window length in days
  end_days: 2          # final window length in days
  batch_size: 10 # number of samples in a training batch per update
  prefetch: 3       # prefetch a few batches to aid efficiency
  use_float64: false


architectures:
  cnn:
    learning_rate: 0.0001
    nlayers: 10
    width: 64
    kernel_size: 5
    activation: "relu" 
    projection: CNN
  unet:
    learning_rate: 0.0005
    base_channels: 32
    depth: 4
    projection: CNN
  fno:
    learning_rate: 0.0001 #[0.0001, 0.0005, 0.001]
    width: 32 #[32, 64, 128]
    modes2: 8 #[8, 16, 24]
    modes1: 8 #[8, 16, 24]
    projection: CNN
  diffusion:
    learning_rate: 0 # is this needed?
    channels: 1
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
  mlp:
    learning_rate: 0.0001
    nlayers: 3
    in_channels: 1
    out_channels: 1
    kernel_size: 3
    width: 64
    activation: "tanh"
  resnet:
    learning_rate: 0.0001
    nlayers: 7
    width: 32
    kernel_size: 5
    activation: "elu" 
    projection: none
  zero:
    learning_rate: 0 # obviously not needed but coded in regardless

  
