filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nx: 64
  Lx: 1000000 #6.283185307179586  # 2π
  beta: 0.00000000001
  kmin: 4.0 
  kmax: 10.0
  nz: 2
  # multi-layer model parameters (only used if nz>1)
  Lz: 500
  rek: 7.0e-8 # gamma
  rd: 15000 # dunno
  delta: 0.1 # ratio between top/bottom layer depth
  U1: 0.025
  U2: 0.0
  hr_nx: 512

plotting:
  nsteps: 1500
  dt: 450
  plotting_window: 0
  cadence: 10
  plot: ['loss', 'mse', 'cfl']
  group_animated: true
  auto_dt: false
  njets: 6
  cfl: 0.5

ml:
  enabled: true
  model_type: resnet
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 4
  n_test: 1
  start_days: 1        # initial window length in days
  end_days: 30          # final window length in days
  batch_size: 10 # number of samples in a training batch per update <--------------------------- is this used?
  prefetch: 3       # prefetch a few batches to aid efficiency
  use_float64: false


architectures:
  cnn:
    learning_rate: 0.0001
    nlayers: 10
    width: 64
    kernel_size: 5
    activation: "relu" 
  unet:
    learning_rate: 0.0005
    base_channels: 32
    depth: 4
  fno:
    learning_rate: 0.0001 #[0.0001, 0.0005, 0.001]
    width: 32 #[32, 64, 128]
    modes2: 8 #[8, 16, 24]
    modes1: 8 #[8, 16, 24]
  diffusion:
    learning_rate: 0 # is this needed?
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
  mlp:
    learning_rate: 0.0001
    nlayers: 3
    kernel_size: 3
    width: 64
    activation: "tanh"
  resnet:
    learning_rate: 0.0001
    nlayers: 7
    width: 32
    kernel_size: 5
    activation: "elu" 
  zero:
    learning_rate: 0 # obviously not needed but coded in regardless

  
