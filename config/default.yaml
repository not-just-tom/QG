filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nondimensional: true
  nx: 32
  Lx: 1000000
  beta: 0.0000000000025
  n_jets: 3 # number of jets in the regime, used for non dimensionalisation
  nz: 2
  # multi-layer model parameters (only used if nz>1)
  Lz: 500 # depth of top layer. 
  drag: 1.0e-8 # Ekman drag coeff
  Ld: 33333 # deformation radius
  delta: 1 # ratio between top/bottom layer depth
  U1: 0.025
  U2: 0.0
  hr_nx: 512
  # Stochastic forcing parameters
  kmin: 7.0   # the wavelenth MODE of inner ring forcing 
  kmax: 10.0   # the wavelenth MODE of outer ring forcing 
  epsilon: 1e-13 # 0.0 for no stochastic forcing 

plotting:
  nsteps: 2000
  dt: 1000
  spinup: 200 # in days
  cadence: 10
  validation_rollout: 1000
  plot: ['loss', 'ke_spectrum', 'pv_spectrum', 'ke_spectrum_movie', 'zero', 'domain']
  auto_dt: false
  cfl: 0.5

ml:
  enabled: true # filesystem sorts into model_type anyway; better to use zero if not enabled for clarity
  model_type: fno
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 16
  n_test: 4
  start_days: 5        # initial window length in days
  end_days: 5         # final window length in days
  batch_size: 10 # number of samples in a training batch per update <--------------------------- is this used?
  patience: 20
  prefetch: 3       # prefetch a few batches to aid efficiency


architectures:
  cnn:
    learning_rate: 0.0001
    loss: mae
    nlayers: 10
    width: 64
    kernel_size: 5
    activation: relu 
    closure_scale: 0.2
  unet:
    learning_rate: 0.0005
    loss: mae
    base_channels: 32
    depth: 4
    closure_scale: 0.2
  fno:
    learning_rate: 0.0005 #[0.0001, 0.0005]
    loss: mae
    width: 32 #[16, 32, 64]
    ymodes: 16 #[8, 16]
    xmodes: 32 #[8, 16, 32]
    projection_width: 128
    depth: 4 #[2, 4, 6]
    activation: gelu
    closure_scale: 0.2 
  diffusion:
    loss: mae
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
    closure_scale: 0.2
  mlp:
    learning_rate: 0.0001
    loss: mae
    nlayers: 3
    kernel_size: 3
    width: 64
    activation: "tanh"
    closure_scale: 0.2
  gru:
    learning_rate: 0.0025
    loss: mae
    hidden_channels: 16 #[8, 16, 32, 64]
    kernel_size: 3 #[1, 3]
    activation: elu #[gelu, elu]
    closure_scale: 0.2 #[0.1, 0.4, 0.8]
  resnet:
    learning_rate: 0.0001 #[0.0001, 0.0005]
    loss: maddison
    nlayers: 7 #[3, 5, 7]
    width: 64 #[32, 64]
    kernel_size: 3  #[3, 5]
    activation: 'elu'
    closure_scale: 0.2 #[0.05, 0.1, 0.2, 0.4] 
  leith:
    leith_coeff: 5
    loss: spectral
  biharmonic:
    smag_coeff: 5
    loss: mae
  zero:
    loss: mae

  
