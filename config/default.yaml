filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nx: 32
  Lx: 1000000
  beta: 0.0000000000025
  nz: 2
  # multi-layer model parameters (only used if nz>1)
  Lz: 500
  drag: 7.0e-8 # Ekman drag coeff
  Ld: 33333 # deformation radius
  delta: 0.1 # ratio between top/bottom layer depth
  U1: 0.025
  U2: 0.0
  hr_nx: 512
  # Stochastic forcing parameters
  kmin: 7.0   # inner ring forcing 
  kmax: 10.0   # outer ring forcing 
  epsilon: 0.000000000001 # 0.0 for no stochastic forcing 

plotting:
  nsteps: 300
  dt: 1000
  spinup: 200 # in days
  cadence: 1
  plot: ['loss', 'ke_spectrum', 'pv_spectrum', 'ke_spectrum_movie', 'zero', 'domain']
  auto_dt: false
  njets: 3
  cfl: 0.5

ml:
  enabled: true # filesystem sorts into model_type anyway; better to use zero if not enabled for clarity
  model_type: resnet
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 24
  n_test: 6
  start_days: 1        # initial window length in days
  end_days: 30         # final window length in days
  batch_size: 10 # number of samples in a training batch per update <--------------------------- is this used?
  prefetch: 3       # prefetch a few batches to aid efficiency


architectures:
  cnn:
    learning_rate: 0.0001
    loss: mse
    nlayers: 10
    width: 64
    kernel_size: 5
    activation: "relu" 
    closure_scale: 0.2
  unet:
    learning_rate: 0.0005
    loss: mse
    base_channels: 32
    depth: 4
    closure_scale: 0.2
  fno:
    learning_rate: 0.0005 #[0.0001, 0.0005]
    loss: multistep #['mse', 'spectral', 'strain', 'multistep', 'maddison']
    width: 64 #[16, 32, 64]
    modes2: 16 #[8, 16]
    modes1: 32 #[8, 16, 32]
    n_layers: 4 #[2, 4, 6]
    zero_mean: true
    closure_scale: 0.1 #[0.1, 0.2, 0.4]
  diffusion:
    loss: mse
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
    closure_scale: 0.2
  mlp:
    learning_rate: 0.0001
    loss: mse
    nlayers: 3
    kernel_size: 3
    width: 64
    activation: "tanh"
    closure_scale: 0.2
  gru:
    learning_rate: 0.0001
    loss: mse
    hidden_layers: 2
  resnet:
    learning_rate: 0.0001 #[0.0001, 0.0005]
    loss: 'maddison'
    nlayers: 7 #[3, 5, 7]
    width: 64 #[32, 64]
    kernel_size: 3  #[3, 5]
    activation: 'elu'
    closure_scale: 0.2 #[0.05, 0.1, 0.2, 0.4] 
  leith:
    leith_coeff: 5
    loss: spectral
  biharmonic:
    smag_coeff: 5
    loss: mse
  zero:
    loss: mse

  
