filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nx: 32
  hr_nx: 512
  Lx: 1000000
  beta: 1e-11
  n_jets: 3 # number of jets in the regime, used for non dimensionalisation
  nz: 1
  Ld: 40000 # deformation radius
  # Stochastic forcing parameters
  kmin: 5.5   # the wavelenth MODE of inner ring forcing 
  kmax: 6.0   # the wavelenth MODE of outer ring forcing 
  epsilon: 1e-15 # 0.0 for no stochastic forcing 
  # multi-layer model parameters (only used if nz>1)
  Lz: 500 # depth of top layer. 
  drag: 1e-10 # Ekman drag coeff
  delta: 1 # ratio between top/bottom layer depth
  U1: 0.01
  U2: 0.0


plotting:
  nsteps: 2000
  dt: 2000
  spinup: 20 # in eddy turnover times
  cadence: 1
  validation_rollout: 41
  plot: ['ke_spectrum_movie', 'loss', 'loss_rollout', 'zero']
  auto_dt: false
  cfl: 0.5

ml:
  enabled: true # filesystem sorts into model_type anyway; better to use zero if not enabled for clarity
  model_type: ['fno', 'zero'] # can be a list
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 7
  n_test: 3
  start_curriculum: 1     # initial window length in steps
  end_curriculum: 1       # final window length in steps
  steps_per_curriculum: 40 # number of steps in a curriculum before the next round
  batch_size: 10 # number of samples in a training batch per update
  patience: 20
  prefetch: 3       # prefetch a few batches to aid efficiency
  memory:
    enabled: false # rolling field memory available to ML architectures
    history_length: 9 # number of previous fields, excluding the current field


architectures:
  cnn:
    learning_rate: 0.0001
    loss: mse
    nlayers: 7
    width: 64
    kernel_size: 5
    activation: relu 
    closure_scale: 0.2
  unet:
    learning_rate: 0.0005
    loss: mse
    base_channels: 32
    depth: 4
    closure_scale: 0.2
  fno:
    learning_rate: 0.001
    loss: mse
    width: [8, 12, 64]
    xmodes: [8, 12, 16]
    ymodes: [8, 12, 16]
    projection_width: [64, 128]
    depth: 2
    spectral_init_power: 0.2
    residual_init: 0.5
    use_layer_norm: true
    activation: gelu
    spectral_lr_multiplier: 1.0
    closure_scale: 0.2
  bfno:
    learning_rate: 0.01
    loss: mse
    width: 10
    modes1: 8
    modes2: 8
    layers: 2
    projection_width: 128
    closure_scale: 0.2
  afno:
    learning_rate: 0.001
    loss: mse
    width: 64
    depth: 2
    num_blocks: 8
    mlp_ratio: 4.0
    sparsity_threshold: 0.01
    hard_thresholding_fraction: 1.0
    double_skip: true
    closure_scale: 0.2
  diffusion:
    loss: mse
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
    closure_scale: 0.2
  mlp:
    learning_rate: 0.0001
    loss: mse
    nlayers: 3
    kernel_size: 3
    width: 64
    activation: "tanh"
    closure_scale: 0.2
  gru:
    learning_rate: 0.0025
    loss: mse
    hidden_channels: 16 #[8, 16, 32, 64]
    kernel_size: 3 #[1, 3]
    activation: elu #[gelu, elu]
    closure_scale: 0.2 #[0.1, 0.4, 0.8]
  rno:
    learning_rate: 0.0025
    loss: mse
    xmodes: 16
    ymodes: 16
    projection_width: 128
    depth: 4
    hidden_channels: 32
    activation: gelu
    closure_scale: 0.2 
  resnet:
    learning_rate: 0.0001 #[0.0001, 0.0005]
    loss: mse
    nlayers: 7 #[3, 5, 7]
    width: 64 #[32, 64]
    kernel_size: 3  #[3, 5]
    activation: 'elu'
    closure_scale: 0.2 #[0.05, 0.1, 0.2, 0.4] 
  leith:
    leith_coeff: 5
    loss: mse
  biharmonic:
    smag_coeff: 5
    loss: mse
  zero:
    loss: mse

  
