filepaths:
  continue_from_checkpoint: false
  out_dir: '../outputs'
  train_set: '../filepath'
  val_set: '../filepath'
  log_level: 'info'

params: 
  seed: 42
  nx: 32
  Lx: 1000000 
  beta: 0.00000000001
  kmin: 4.0 
  kmax: 10.0
  nz: 1
  # multi-layer model parameters (only used if nz>1)
  Lz: 500
  rek: 7.0e-8 # gamma
  rd: 15000 # dunno
  delta: 0.1 # ratio between top/bottom layer depth
  U1: 0.025
  U2: 0.0
  hr_nx: 512

plotting:
  nsteps: 2000
  dt: 1000
  spinup: 200
  cadence: 10
  plot: ['loss', 'ke_spectrum', 'ke_spectrum_movie', 'zero', 'domain']
  auto_dt: false
  njets: 3
  cfl: 0.5

ml:
  enabled: true
  model_type: resnet
  optimiser: AdamW
  device: 'cpu' # 'cpu' or 'gpu' <-- gotta be careful here w cuda supported jaxlib. 
  n_train: 15
  n_test: 2
  start_days: 1        # initial window length in days
  end_days: 9         # final window length in days
  batch_size: 10 # number of samples in a training batch per update <--------------------------- is this used?
  prefetch: 3       # prefetch a few batches to aid efficiency
  use_float64: false


architectures:
  cnn:
    learning_rate: 0.0001
    loss: mse
    nlayers: 10
    width: 64
    kernel_size: 5
    activation: "relu" 
    closure_scale: 0.2
  unet:
    learning_rate: 0.0005
    loss: mse
    base_channels: 32
    depth: 4
    closure_scale: 0.2
  fno:
    learning_rate: 0.0001 #[0.0001, 0.0005, 0.001]
    loss: maddison
    width: 32
    modes2: 16
    modes1: 16
    n_layers: 3
    zero_mean: true
    closure_scale: 0.2
  diffusion:
    loss: mse
    cutoff: 16.0
    n_steps: 3
    alpha: 0.2
    projection: diffusion
    projection_params:
      tikhonov: 1e-2
      beta: 0.2
      alpha_clip: 1.0
      min_q_mag: 1e-6
    closure_scale: 0.2
  mlp:
    learning_rate: 0.0001
    loss: mse
    nlayers: 3
    kernel_size: 3
    width: 64
    activation: "tanh"
    closure_scale: 0.2
  resnet:
    learning_rate: 0.0001
    loss: maddison
    nlayers: 7
    width: 32
    kernel_size: 5
    activation: "elu"
    closure_scale: 0.2 
  zero:
    loss: mse

  
